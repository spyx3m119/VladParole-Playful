    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Fredoka', sans-serif;
        background-color: #0f1014; /* Deep dark background */
        color: #ffffff;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .text-glow {
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      }
      /* Custom Animation for floating blobs */
      @keyframes float {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes float-subtle {
        0% { transform: translate(0px, 0px) rotate(-10deg); }
        50% { transform: translate(0px, -15px) rotate(-8deg); }
        100% { transform: translate(0px, 0px) rotate(-10deg); }
      }
      .animate-float {
        animation: float 7s infinite ease-in-out;
      }
      .animate-float-delayed {
        animation: float 7s infinite ease-in-out 2s;
      }
      .animate-float-slow {
        animation: float 10s infinite ease-in-out 1s;
      }
      .animate-float-subtle {
        animation: float-subtle 5s infinite ease-in-out;
      }
    </style>
